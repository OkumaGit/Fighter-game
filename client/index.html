<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
        <title>Arena Clash</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Russo+One&display=swap"
            rel="stylesheet"
        />
        <style>
            #loading-backdrop {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(circle at center, #172554 0%, #090d16 80%, #030712 100%);
                z-index: 99999;
                user-select: none;
            }
            .loader___content {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 90%;
                max-width: 480px;
                padding: 30px;
                box-sizing: border-box;
            }
            .loader___logo {
                width: 320px;
                max-width: 85vw;
                height: auto;
                aspect-ratio: 16 / 9;
                display: block;
                margin-bottom: 26px;
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this application.</noscript>
        <div id="root"></div>
        <div id="loading-backdrop">
            <div class="loader___content">
                <img
                    class="loader___logo"
                    src="/resources/logo.png"
                    alt="Arena Clash logo"
                    width="320"
                    height="180"
                    style="width: 320px; max-width: 85vw; height: auto; aspect-ratio: 16 / 9; display: block;"
                />
                <div class="loader___bar-container">
                    <div class="loader___bar" id="loading-progress-bar"></div>
                </div>
                <div class="loader___status-wrap">
                    <span class="loader___status-icon">⚡</span>
                    <span class="loader___status" id="loading-status-text"
                        >We are looking for the best fighters...</span
                    >
                    <span class="loader___cursor"></span>
                </div>
            </div>
        </div>
        <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
        <script type="module" src="./src/index.js"></script>
    </body>
</html>
